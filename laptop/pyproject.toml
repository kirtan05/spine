[project]
name = "spine-laptop"
version = "0.1.0"
description = "Local half of spine: the shelf ingest pipeline and the KOReader statistics importer"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
shelf = "shelf.cli:main"
kostats = "kostats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf", "src/kostats", "src/spinecore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
